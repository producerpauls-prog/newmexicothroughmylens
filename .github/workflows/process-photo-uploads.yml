name: Process photo uploads

on:
  push:
    branches:
      - main
    paths:
      - incoming-photos/**
      - '*.jpg'
      - '*.jpeg'
      - '*.JPG'
      - '*.JPEG'

permissions:
  contents: write

concurrency:
  group: process-photo-uploads
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assign IDs and publish originals
        run: node scripts/process-photo-uploads.mjs
      - name: Audit print quality
        run: node scripts/audit-print-quality.mjs
      - name: Commit published photographs
        run: |
          if git diff --quiet; then
            echo "No new photographs were published."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .
          git add -- print-assets photos.json print-eligibility.json
          git commit -m "Publish uploaded photographs"
          git push
